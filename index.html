<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <div class="page-shell">
        <div class="auth-card">
            <div class="card-header">
                <p class="eyebrow">Welcome</p>
                <h1>Create Account</h1>
                <p>Sign up to access your personalized dashboard.</p>
            </div>

            <form id="signupForm" novalidate>
                <div class="input-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                    <small class="error-text" id="errorname" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <small class="error-text" id="erroremail" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                    <small class="error-text" id="errorpassword" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" min="1" placeholder="Enter your age">
                    <small class="error-text" id="errorage" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="dob">Date of birth</label>
                    <input type="date" id="dob">
                    <small class="error-text" id="errordob" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="country">Country</label>
                    <select id="country">
                        <option value="">Select Country</option>
                        <option value="Pakistan">Pakistan</option>
                        <option value="UAE">UAE</option>
                        <option value="India">India</option>
                        <option value="China">China</option>
                    </select>
                    <small class="error-text" id="errorcountry" aria-live="polite"></small>
                </div>

                <button type="submit" class="primary-btn" id="signBtn">Sign Up</button>
            </form>

            <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
