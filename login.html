<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
    <div class="page-shell">
        <div class="auth-card">
            <div class="card-header">
                <p class="eyebrow">Welcome back</p>
                <h1>Login</h1>
                <p>Access your account with your email and password.</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <small class="error-text" id="erroremail" aria-live="polite"></small>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                    <small class="error-text" id="errorpassword" aria-live="polite"></small>
                </div>

                <button type="submit" class="primary-btn" id="loginBtn">Login</button>
            </form>

            <p class="switch-link">Need an account? <a href="index.html">Sign up</a></p>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
